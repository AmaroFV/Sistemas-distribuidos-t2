services:
  # 1. Base de datos Redis (El motor del Caché)
  redis-server:
    image: redis:alpine
    container_name: redis_cache
    # Aquí es donde variarán los parámetros para los experimentos del informe (50mb, 200mb, etc y LRU/LFU)
    command: redis-server --maxmemory 10mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - dist_net

  # 2. Servicio de Métricas
  metrics_service:
    build: ./metrics
    container_name: metrics_api
    ports:
      - "8002:8002"
    volumes:
      # Montamos la carpeta data para que el CSV sobreviva si el contenedor se apaga
      - ./data:/app/data
    networks:
      - dist_net

  # 3. Generador de Respuestas 
  response_generator:
    build: ./response_generator
    container_name: response_api
    ports:
      - "8000:8000"
    volumes:
      # Montamos la carpeta data para que pueda leer el CSV de la región metropolitana
      - ./data:/app/data
    environment:
      - METRICS_URL=http://metrics_service:8002/event
    networks:
      - dist_net

  # 4. Sistema de Caché
  cache_service:
    build: ./cache_service
    container_name: cache_api
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
      - RESPONSE_GEN_URL=http://response_generator:8000/query
      - METRICS_URL=http://metrics_service:8002/event
      # TTL para el Experimento D (5s / 60s / 300s)
      - TTL_SECONDS=${TTL_SECONDS:-60}
    depends_on:
      - redis-server
      - response_generator
      - metrics_service
    networks:
      - dist_net

  # 5. Generador de Tráfico (Modo Síncrono T1)
  traffic_generator:
    build: ./traffic_generator
    container_name: traffic_sim
    environment:
      - CACHE_URL=http://cache_service:8001/query
      # Aquí se configura si usan Zipf o Uniforme para sus pruebas
      - DISTRIBUTION=${DISTRIBUTION:-uniform}
      # Parámetros para controlar el tamaño de la corrida (útil para los experimentos)
      - TOTAL_REQUESTS=${TOTAL_REQUESTS:-5000}
      - WARMUP_REQUESTS=${WARMUP_REQUESTS:-200}
      - RATE_RPS=${RATE_RPS:-25}
      - ZIPF_S=${ZIPF_S:-1.2}
    depends_on:
      - cache_service
    networks:
      - dist_net

#Nueva Secciones
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dist_net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - dist_net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 8
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic queries-main --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic queries-retry --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic queries-dlq --partitions 3 --replication-factor 1
        echo "Kafka topics OK"
    networks:
      - dist_net

  kafka_producer:
    build:
      context: ./t2_standalone
      dockerfile: kafka_producer/Dockerfile
    container_name: kafka_producer
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_MAIN=queries-main
      - DISTRIBUTION=${DISTRIBUTION:-zipf}
      - TOTAL_REQUESTS=${TOTAL_REQUESTS:-5000}
      - WARMUP_REQUESTS=${WARMUP_REQUESTS:-200}
      - RATE_RPS=${RATE_RPS:-0}
      - ZIPF_S=${ZIPF_S:-1.2}
    depends_on:
      - kafka-init
      - cache_service
    profiles:
      - kafka
    networks:
      - dist_net

  kafka_consumer:
    build:
      context: ./t2_standalone
      dockerfile: kafka_consumer/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_MAIN=queries-main
      - TOPIC_RETRY=queries-retry
      - TOPIC_DLQ=queries-dlq
      - KAFKA_GROUP_ID=query-processors
      - MAX_RETRIES=${MAX_RETRIES:-5}
      - CACHE_URL=http://cache_service:8001/query
      - METRICS_URL=http://metrics_service:8002/event
    depends_on:
      - kafka-init
      - cache_service
      - metrics_service
    deploy:
      replicas: ${KAFKA_CONSUMER_REPLICAS:-1}
    profiles:
      - kafka
    networks:
      - dist_net


# Declaración global de redes
networks:
  dist_net:
    driver: bridge